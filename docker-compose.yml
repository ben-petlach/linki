services:
  linki:
    build:
      context: .
      args:
        LINKI_SOURCE_COMMIT: ${LINKI_SOURCE_COMMIT:-unknown}
        APP_VERSION: ${APP_VERSION:-dev}
    image: linki-local:${APP_VERSION:-dev}
    init: true
    ports:
      - "127.0.0.1:${PORT:-3456}:3000"
    volumes:
      - linki_data:/data
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      LINKI_DB_PATH: ${LINKI_DB_PATH:-/data/linki.db}
      LINKI_IMAGE_DIGEST: ${LINKI_IMAGE_DIGEST:-unavailable}
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.5"

volumes:
  linki_data:
